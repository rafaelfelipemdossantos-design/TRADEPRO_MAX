<style>
  :root{ --cyan:#22d3ee; --amber:#fbbf24; --emerald:#34d399; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:#080b12;
    color:#e2e8f0;
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; position:relative; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .font-display{ font-family:'Chakra Petch',sans-serif; }
  .font-mono{ font-family:'JetBrains Mono',monospace; }
  .bg-grid{
    position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:28px 28px;
  }
  .glow{ position:absolute; border-radius:50%; filter:blur(100px); pointer-events:none; }
  .glow-cyan{ width:420px; height:420px; background:rgba(34,211,238,.10); top:-15%; right:-10%; }
  .glow-emerald{ width:420px; height:420px; background:rgba(52,211,153,.06); bottom:-15%; left:-10%; }
  .card{
    position:relative; z-index:2;
    width:min(420px, 90vw);
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);
    border-radius:1.5rem;
    padding:2.5rem 2rem;
    text-align:center;
    backdrop-filter:blur(20px);
    animation:rise .5s cubic-bezier(.16,1,.3,1) both;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; width:100%; height:2px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .logo{
    width:88px; height:88px; margin:0 auto 1.25rem;
    border-radius:22%; border:1px solid rgba(34,211,238,.35);
    box-shadow:0 20px 40px -12px rgba(0,0,0,.6);
  }
  h1{
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:1.6rem;
    letter-spacing:.02em; margin:0 0 .35rem;
    background:linear-gradient(90deg,#fff,#94a3b8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .eyebrow{
    font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.18em;
    color:#64748b; margin:0 0 1.5rem;
  }
  p.desc{ font-size:.85rem; line-height:1.6; color:#94a3b8; margin:0 0 2rem; }
  .modules{ display:flex; justify-content:center; gap:.5rem; margin-bottom:2rem; flex-wrap:wrap; }
  .chip{
    font-family:'JetBrains Mono',monospace; font-size:.65rem; font-weight:600;
    color:#e2e8f0; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    padding:.35rem .65rem; border-radius:.5rem; letter-spacing:.05em;
  }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:.6rem;
    width:100%; padding:1rem; border:none; border-radius:1rem; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:.9rem; text-transform:uppercase; letter-spacing:.05em;
    background:linear-gradient(90deg, var(--cyan), #06b6d4); color:#04121a;
    text-decoration:none;
    box-shadow:0 12px 30px -10px rgba(34,211,238,.45);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 16px 34px -10px rgba(34,211,238,.55); }
  .btn svg{ width:18px; height:18px; }
  .footnote{ margin-top:1.5rem; font-size:.65rem; color:#475569; text-transform:uppercase; letter-spacing:.12em; }
  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } .btn{ transition:none; } }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow glow-cyan"></div>
