<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Calculadora TradePro™ - Sistema de Performance para SOS, MOP e KBDs">
    <title>Calculadora TradePro™</title>
    
    <!-- PWA: Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Ícones -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">

    <!-- PWA / iOS install meta -->
    <meta name="apple-mobile-web-app-title" content="TradePro">
    <meta name="application-name" content="TradePro">
    <meta name="msapplication-TileColor" content="#0f172a">
    <meta name="msapplication-TileImage" content="icons/icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React e Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; box-shadow: 0 0 20px rgba(34, 211, 238, 0.6); } 50% { opacity: 0.8; box-shadow: 0 0 8px rgba(34, 211, 238, 0.3); } }
        @keyframes pulse-pink { 0%, 100% { opacity: 1; box-shadow: 0 0 20px rgba(236, 72, 153, 0.6); } 50% { opacity: 0.8; box-shadow: 0 0 8px rgba(236, 72, 153, 0.3); } }
        
        body { 
            -webkit-tap-highlight-color: transparent; 
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            background-color: #0f172a;
        }
        .loader-spinner {
            border: 2px solid rgba(34, 211, 238, 0.1);
            border-top: 2px solid #22d3ee;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }
        .active-target-glow {
            animation: pulse-glow 2s infinite ease-in-out;
            border-color: #22d3ee !important;
            background-color: rgba(6, 182, 212, 0.25) !important;
            color: #fff !important;
            transform: scale(1.05);
            z-index: 10;
        }
        .active-cko-glow {
            animation: pulse-pink 2s infinite ease-in-out;
            border-color: #ec4899 !important;
            background-color: rgba(236, 72, 153, 0.2) !important;
            color: #fff !important;
        }
        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.375rem;
            background-color: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .custom-checkbox:checked {
            background-color: #06b6d4;
            border-color: #06b6d4;
        }
        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute; color: white; font-size: 0.875rem; font-weight: bold;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }
    </style>
</head>
<body class="text-white overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const apiKey = "AQ.Ab8RN6JrsE5i9vxKYzq7zf3S3eaqtGhHF84FAioTJDSn7KE0WQ"; // Insira sua chave aqui
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";

        const GENERAL_BRANDS = [
            "Pampers", "Always", "Downy", "Desodorantes masculinos", "Desodorantes femininos",
            "Cabelos", "Oral-B Escovas", "Oral-B Cremes", "Gillette Masculina", "Gillette Feminina", "Outra Marca"
        ];

        const INITIAL_KBDS = [
            { id: "always_suave", brand: "Always", category: "Versões Suave", target: 70 },
            { id: "downy_azul", brand: "Downy", category: "Bloco Azul", target: 50 },
            { id: "downy_colorido", brand: "Downy", category: "Bloco Colorido", target: 40 },
            { id: "oralb_pastas", brand: "Oral-B", category: "Branqueamento", target: 60 },
            { id: "pantene_bond", brand: "Pantene", category: "Bond Repair", target: 20 },
            { id: "pantene_top", brand: "Pantene", category: "Top Versões", target: 40 },
            { id: "gillette_masc", brand: "Gillette Masculina", category: "Sistemas", target: 35 },
            { id: "venus_fem", brand: "Venus", category: "Sistemas", target: 20 }
        ];

        const CKO_CHECKLIST_ITEMS = [
            "Aparelho Mach 3", "Carga Mach 3", "Presto3 Masc", "Venus", "Oral-B escovas",
            "Ampolas ou Óleo", "Sérum Bambu"
        ];

        // --- UTILITÁRIOS ---
        const getTimestamp = () => `📅 *Data:* ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
        const formatSmart = (val, decimals = 1) => (val === 0 || isNaN(val)) ? "0" : Number(val.toFixed(decimals)).toLocaleString('pt-BR');
        const safeParseFloat = (val) => {
            if (typeof val === 'string') val = val.replace('%', '').replace(',', '.');
            const parsed = parseFloat(val);
            return isNaN(parsed) ? 0 : Math.max(0, parsed);
        };
        
        const copyToClipboard = (text, onSuccess) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus(); textArea.select();
            try { document.execCommand('copy'); onSuccess('Relatório copiado!'); } catch (err) {}
            document.body.removeChild(textArea);
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                pie: <><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>,
                bag: <><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></>,
                card: <><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></>,
                share: <><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></>,
                upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>,
                settings: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.72l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
                check: <><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></>,
                chevron: <path d="m6 9 6 6 6-6"/>,
                trash: <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>,
                plus: <><path d="M12 5v14M5 12h14" /></>,
                alert: <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>
            };
            return <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || icons.check}</svg>;
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-6 shadow-xl relative overflow-hidden group ${className}`}>
                {children}
            </div>
        );

        const SmartInput = ({ label, value, onChange, unit, type = "number" }) => (
            <div className="relative group">
                <input type={type} inputMode="decimal" value={value} onChange={(e) => onChange(e.target.value)} placeholder=" " className="peer w-full bg-black/20 border border-white/10 rounded-xl px-4 pt-6 pb-2 text-white text-lg font-medium outline-none focus:border-cyan-500/50 transition-all placeholder-transparent" />
                <label className="absolute left-4 top-4 text-slate-400 text-xs uppercase tracking-wider transition-all duration-200 peer-placeholder-shown:text-base peer-placeholder-shown:top-3.5 peer-focus:top-1.5 peer-focus:text-xs peer-focus:text-cyan-400">{label}</label>
                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm">{unit}</span>
            </div>
        );

        const ResultCard = ({ value, suffix, label, description, highlightColor = "text-cyan-400", onCopy, canCopy, status, gapVal, unitLabel, targetVal }) => (
            <div className="relative mt-6">
                <div className="bg-[#131c33] border border-white/10 rounded-3xl p-6 flex flex-col items-center text-center shadow-2xl">
                    <div className="flex justify-between w-full mb-2">
                        <span className="text-slate-400 text-[10px] font-bold uppercase tracking-widest">{label}</span>
                        {status && (
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${status === 'OK' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
                                {status}
                            </span>
                        )}
                    </div>
                    <div className="flex items-baseline gap-1 mb-1">
                        <span className={`text-5xl font-bold tracking-tighter ${highlightColor}`}>{value}</span>
                        <span className="text-xl font-bold text-slate-500">{suffix}</span>
                    </div>
                    {targetVal !== undefined && <p className="text-[10px] text-slate-400 font-bold uppercase mt-1">Objetivo: {targetVal}%</p>}
                    <p className="text-xs text-slate-400 mt-2 mb-6 max-w-[200px] leading-relaxed">{description}</p>
                    {gapVal > 0 && (
                        <div className="mb-6 px-4 py-2 bg-red-500/10 border border-red-500/20 rounded-2xl animate-pulse">
                             <p className="text-[10px] text-red-400 font-bold uppercase mb-1">Gap para meta</p>
                             <p className="text-2xl font-black text-white">{formatSmart(gapVal)} <span className="text-sm font-normal text-slate-500">{unitLabel}</span></p>
                        </div>
                    )}
                    <button onClick={onCopy} disabled={!canCopy} className={`w-full py-3 rounded-xl flex items-center justify-center gap-2 font-semibold text-sm transition-all ${canCopy ? 'bg-white/10 hover:bg-white/20 text-white' : 'bg-white/5 text-slate-600 cursor-not-allowed'}`}>
                        <Icon name="share" className="w-4 h-4" /> {canCopy ? 'Copiar Relatório' : 'Preencha os dados'}
                    </button>
                </div>
            </div>
        );

        // --- AI PROCESSOR ---
        const processImage = async (base64Data, mimeType, prompt) => {
            if (!apiKey || apiKey.trim() === "") {
                throw new Error("Chave de API não configurada. Use o modo manual.");
            }
            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType, data: base64Data } }] }],
                generationConfig: { 
                    temperature: 0.1,
                    responseMimeType: "application/json"
                }
            };
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });
            if (!response.ok) throw new Error("Erro na comunicação com a IA.");
            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error("A IA não retornou dados.");
            return JSON.parse(text);
        };

        // --- MÓDULO SOS ---
        function SosModule({ unitMode, onNotify, targets, setTargets }) {
            const [inputs, setInputs] = useState(() => JSON.parse(localStorage.getItem('sos_inputs') || '{"marca":"","total":""}'));
            const [brand, setBrand] = useState(GENERAL_BRANDS[0]);
            const [loading, setLoading] = useState(false);
            const [showManual, setShowManual] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => localStorage.setItem('sos_inputs', JSON.stringify(inputs)), [inputs]);

            const currentShare = useMemo(() => {
                const m = safeParseFloat(inputs.marca); const t = safeParseFloat(inputs.total);
                return t > 0 ? (m / t) * 100 : 0;
            }, [inputs]);

            const targetShare = useMemo(() => {
                const found = Object.entries(targets).find(([key]) => brand.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(brand.toLowerCase()));
                return found ? safeParseFloat(found[1]) : null;
            }, [brand, targets]);

            const gapVal = useMemo(() => targetShare ? Math.max(0, (safeParseFloat(inputs.total) * (targetShare / 100)) - safeParseFloat(inputs.marca)) : 0, [targetShare, inputs]);
            const status = useMemo(() => targetShare && inputs.marca ? (currentShare >= targetShare ? 'OK' : 'ABAIXO') : null, [currentShare, targetShare, inputs]);

            const handleUpload = async (e) => {
                const file = e.target.files[0]; if (!file) return;
                setLoading(true);
                setShowManual(false);
                const reader = new FileReader();
                reader.onloadend = async () => {
                    try {
                        const categoriesStr = GENERAL_BRANDS.map(b => `'${b}'`).join(', ');
                        const prompt = `Analise a tabela de share 'Gôndola'. Extraia as porcentagens (%) exatas para cada uma das categorias mencionadas a seguir. Use EXATAMENTE estes nomes como chaves no JSON de saída: ${categoriesStr}. Se houver um hífen (-) ou valor não legível, use 0 ou ignore a categoria. Retorne APENAS o JSON.`;
                        const data = await processImage(reader.result.split(',')[1], file.type, prompt);
                        
                        const normalizedData = {};
                        GENERAL_BRANDS.forEach(b => {
                            if (data[b] !== undefined) normalizedData[b] = safeParseFloat(data[b]);
                        });

                        setTargets(normalizedData); 
                        onNotify("Metas de Gôndola extraídas!");
                    } catch (e) { 
                        onNotify("Erro ao processar imagem ou chave ausente."); 
                        setShowManual(true);
                    }
                    finally { setLoading(false); if(fileInputRef.current) fileInputRef.current.value = ""; }
                };
                reader.readAsDataURL(file);
            };

            const handleManualMetaChange = (brandKey, val) => {
                const newTargets = { ...targets, [brandKey]: safeParseFloat(val) };
                setTargets(newTargets);
            };

            const generateSosReport = () => {
                const unit = unitMode.toUpperCase();
                let report = `*Relatório SOS - ${brand}*\n\n📏 *Modo:* ${unit}\n📍 *Espaço ${brand}:* ${inputs.marca} ${unitMode}\n🌍 *Total Categoria:* ${inputs.total} ${unitMode}\n📊 *Share Atual:* ${formatSmart(currentShare)}%\n🎯 *Objetivo MOP:* ${targetShare || '--'}%\n🚨 *Status:* ${status || '--'}`;
                if (status === 'OK') report += `\n✅ *Meta Batida!*`;
                else if (status === 'ABAIXO') report += `\n🛠️ *Faltam:* ${formatSmart(gapVal)} ${unitMode}`;
                report += `\n\n${getTimestamp()}`;
                copyToClipboard(report, onNotify);
            };

            return (
                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <Card className="bg-cyan-500/5 border-cyan-500/20">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-cyan-500/20 rounded-lg text-cyan-400"><Icon name="upload" /></div>
                                <div><h3 className="text-xs font-bold uppercase">Leitor de Tabela MOP</h3><p className="text-[9px] text-slate-400">Extração de alta precisão</p></div>
                            </div>
                            <button onClick={() => fileInputRef.current.click()} disabled={loading} className="px-4 py-2 bg-cyan-500 text-white rounded-xl text-[10px] font-bold uppercase flex items-center gap-2 hover:bg-cyan-600 transition-colors">
                                {loading ? <div className="loader-spinner"></div> : <Icon name="upload" className="w-3 h-3"/>} {loading ? 'Processando...' : 'Upload'}
                            </button>
                            <input type="file" ref={fileInputRef} onChange={handleUpload} className="hidden" accept="image/*" />
                        </div>
                        
                        {showManual && (
                            <div className="mt-4 p-4 bg-orange-500/10 border border-orange-500/20 rounded-2xl animate-in slide-in-from-top-2">
                                <div className="flex items-center gap-2 text-orange-400 mb-3">
                                    <Icon name="alert" className="w-4 h-4" />
                                    <span className="text-[10px] font-bold uppercase">Entrada Manual de Metas (MOP)</span>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    {GENERAL_BRANDS.map(b => (
                                        <div key={b} className="flex flex-col gap-1">
                                            <label className="text-[8px] text-slate-500 uppercase font-bold">{b}</label>
                                            <input 
                                                type="number" 
                                                placeholder="Meta %" 
                                                value={targets[b] || ""} 
                                                onChange={(e) => handleManualMetaChange(b, e.target.value)}
                                                className="bg-black/40 border border-white/5 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-cyan-500/50"
                                            />
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setShowManual(false)} className="w-full mt-4 py-2 text-[10px] font-bold uppercase text-slate-400 border border-white/5 rounded-xl hover:bg-white/5">Fechar Editor</button>
                            </div>
                        )}

                        {Object.keys(targets).length > 0 && !showManual && (
                            <div className="mt-4 flex flex-wrap gap-2 pt-4 border-t border-white/5">
                                {Object.entries(targets).map(([k, v]) => {
                                    const isSelected = brand.toLowerCase().includes(k.toLowerCase()) || k.toLowerCase().includes(brand.toLowerCase());
                                    return (
                                        <div key={k} onClick={() => setShowManual(true)} className={`px-2 py-1 rounded-md text-[9px] font-bold border transition-all duration-500 cursor-pointer ${isSelected ? 'active-target-glow' : 'bg-black/30 border-white/5 text-slate-400'}`}>
                                            {k}: <span className="text-cyan-400">{v}%</span>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </Card>

                    <Card>
                        <div className="mb-4 font-bold text-lg">Configuração SOS</div>
                        <div className="space-y-4">
                            <div className="relative">
                                <select value={brand} onChange={(e) => setBrand(e.target.value)} className="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-sm font-medium appearance-none outline-none focus:border-cyan-500 cursor-pointer">
                                    {GENERAL_BRANDS.map(b => <option key={b} value={b} className="bg-slate-800">{b}</option>)}
                                </select>
                                <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500"><Icon name="chevron" className="w-4 h-4"/></div>
                            </div>
                            <SmartInput label={`Espaço ${brand}`} value={inputs.marca} onChange={(v) => setInputs({ ...inputs, marca: v })} unit={unitMode} />
                            <SmartInput label="Total Categoria" value={inputs.total} onChange={(v) => setInputs({ ...inputs, total: v })} unit={unitMode} />
                        </div>
                    </Card>

                    <ResultCard value={formatSmart(currentShare)} suffix="%" label="resultado sos" status={status} gapVal={gapVal} unitLabel={unitMode} targetVal={targetShare} description={targetShare ? `Meta de ${targetShare}% identificada.` : "Aguardando definição de meta."} onCopy={generateSosReport} canCopy={inputs.marca && inputs.total} />
                </div>
            );
        }

        // --- MÓDULO CKO ---
        function CkoModule({ onNotify }) {
            const [inputs, setInputs] = useState(() => JSON.parse(localStorage.getItem('cko_inputs') || '{"presenca":"","total":""}'));
            const [checklist, setChecklist] = useState(() => JSON.parse(localStorage.getItem('cko_checklist') || '{}'));
            const [aiTarget, setAiTarget] = useState(() => JSON.parse(localStorage.getItem('cko_ai_target') || 'null'));
            const [loading, setLoading] = useState(false);
            const [showManual, setShowManual] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => localStorage.setItem('cko_inputs', JSON.stringify(inputs)), [inputs]);
            useEffect(() => localStorage.setItem('cko_checklist', JSON.stringify(checklist)), [checklist]);
            useEffect(() => localStorage.setItem('cko_ai_target', JSON.stringify(aiTarget)), [aiTarget]);

            const result = useMemo(() => {
                const p = safeParseFloat(inputs.presenca); const t = safeParseFloat(inputs.total);
                return t > 0 ? (p / t) * 100 : 0;
            }, [inputs]);

            const status = useMemo(() => aiTarget ? (result >= aiTarget.percent ? 'OK' : 'ABAIXO') : null, [result, aiTarget]);

            const handleUpload = async (e) => {
                const file = e.target.files[0]; if (!file) return;
                setLoading(true);
                setShowManual(false);
                const reader = new FileReader();
                reader.onloadend = async () => {
                    try {
                        const itemsStr = CKO_CHECKLIST_ITEMS.map(i => `'${i}'`).join(', ');
                        const prompt = `Analise a imagem 'Checkout HB'. 1. Extraia o valor numérico após 'OBJ:'. 2. Identifique quais destes produtos estão listados (Venus, Mach3, etc): ${itemsStr}. Retorne JSON: {"percent": uimhir, "items": ["nome_exato", ...]}.`;
                        const data = await processImage(reader.result.split(',')[1], file.type, prompt);
                        setAiTarget(data);
                        onNotify("Dados extraídos com sucesso!");
                    } catch (e) { 
                        onNotify("Erro ao processar imagem ou chave ausente."); 
                        setShowManual(true);
                    }
                    finally { setLoading(false); if(fileInputRef.current) fileInputRef.current.value = ""; }
                };
                reader.readAsDataURL(file);
            };

            const handleManualMetaChange = (val) => {
                setAiTarget(prev => ({ ...prev, percent: safeParseFloat(val), items: prev?.items || [] }));
            };

            const generateCkoReport = () => {
                const checkedList = Object.entries(checklist).filter(([_, checked]) => checked).map(([name]) => `✅ ${name}`).join('\n');
                const report = `*Relatório CKO*\n💳 *CKO com Presença:* ${inputs.presenca}\n🏪 *Total de CKO Loja:* ${inputs.total}\n📊 *Total de Penetração:* ${formatSmart(result)}%\n🎯 *Objetivo do Mop:* ${aiTarget?.percent || '--'}%\n\n*Itens Presentes:*\n${checkedList || 'Nenhum item marcado'}\n\n${getTimestamp()}`;
                copyToClipboard(report, onNotify);
            };

            return (
                <div className="space-y-6">
                    <Card className="bg-pink-500/5 border-pink-500/20">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-pink-500/20 rounded-lg text-pink-400"><Icon name="upload" /></div>
                                <div><h3 className="text-xs font-bold uppercase">Leitor de CKO</h3><p className="text-[9px] text-slate-400">Análise de penetração e produtos</p></div>
                            </div>
                            <button onClick={() => fileInputRef.current.click()} disabled={loading} className="px-4 py-2 bg-pink-500 text-white rounded-xl text-[10px] font-bold uppercase flex items-center gap-2 hover:opacity-90 transition-opacity">
                                {loading ? <div className="loader-spinner"></div> : <Icon name="upload" className="w-3 h-3"/>} {loading ? 'Lendo...' : 'Upload'}
                            </button>
                            <input type="file" ref={fileInputRef} onChange={handleUpload} className="hidden" accept="image/*" />
                        </div>

                        {showManual && (
                            <div className="mt-4 p-4 bg-orange-500/10 border border-orange-500/20 rounded-2xl animate-in slide-in-from-top-2 mb-4">
                                <div className="flex items-center gap-2 text-orange-400 mb-3">
                                    <Icon name="alert" className="w-4 h-4" />
                                    <span className="text-[10px] font-bold uppercase">Entrada Manual de Meta (CKO)</span>
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-[8px] text-slate-500 uppercase font-bold">Objetivo MOP (%)</label>
                                    <input 
                                        type="number" 
                                        placeholder="Ex: 80" 
                                        value={aiTarget?.percent || ""} 
                                        onChange={(e) => handleManualMetaChange(e.target.value)}
                                        className="bg-black/40 border border-white/5 rounded-lg px-3 py-2 text-sm outline-none focus:border-pink-500/50"
                                    />
                                </div>
                                <button onClick={() => setShowManual(false)} className="w-full mt-4 py-2 text-[10px] font-bold uppercase text-slate-400 border border-white/5 rounded-xl hover:bg-white/5">Fechar Editor</button>
                            </div>
                        )}

                        <div className="grid grid-cols-1 gap-2 pt-4 border-t border-white/5">
                            <div className="text-[10px] font-bold uppercase text-slate-500 mb-1">Checklist de Itens Obrigatórios</div>
                            {CKO_CHECKLIST_ITEMS.map(item => {
                                const isAiRequested = aiTarget?.items?.some(aiItem => aiItem.toLowerCase().includes(item.toLowerCase()) || item.toLowerCase().includes(aiItem.toLowerCase()));
                                return (
                                    <div key={item} onClick={() => setChecklist(p => ({...p, [item]: !p[item]}))} className={`flex items-center gap-3 p-3 bg-black/20 rounded-xl border transition-all ${isAiRequested ? 'active-cko-glow' : 'border-white/5 opacity-60'}`}>
                                        <input type="checkbox" checked={!!checklist[item]} onChange={()=>{}} className="custom-checkbox" />
                                        <span className="text-xs font-medium">{item}</span>
                                        {isAiRequested && <span className="ml-auto text-[8px] bg-pink-500/20 text-pink-400 px-1.5 py-0.5 rounded font-bold">META MOP</span>}
                                    </div>
                                );
                            })}
                        </div>
                    </Card>
                    <Card>
                        <div className="mb-4 font-bold text-lg">Penetração CKO</div>
                        <div className="space-y-4">
                            <SmartInput label="CKO Com Presença" value={inputs.presenca} onChange={(v) => setInputs({ ...inputs, presenca: v })} unit="un" />
                            <SmartInput label="Total de CKO Na Loja" value={inputs.total} onChange={(v) => setInputs({ ...inputs, total: v })} unit="un" />
                        </div>
                    </Card>
                    <ResultCard value={formatSmart(result)} suffix="%" label="penetração cko" highlightColor="text-pink-400" status={status} targetVal={aiTarget?.percent} description={aiTarget ? `Meta de ${aiTarget.percent}% identificada.` : "Carregue a imagem do Checkout."} onCopy={generateCkoReport} canCopy={inputs.presenca && inputs.total} />
                </div>
            );
        }

        // --- MÓDULO KBDS ---
        function KbdsModule({ unitMode, onNotify }) {
            const [allTargets, setAllTargets] = useState(() => {
                const saved = localStorage.getItem('kbds_targets');
                return saved ? JSON.parse(saved) : INITIAL_KBDS;
            });
            const [selectedId, setSelectedId] = useState(allTargets[0]?.id || "");
            const [inputs, setInputs] = useState(() => JSON.parse(localStorage.getItem('kbds_inputs') || '{"cat":"","val":""}'));
            const [channelCC, setChannelCC] = useState(false);
            const [isEditing, setIsEditing] = useState(false);

            useEffect(() => localStorage.setItem('kbds_targets', JSON.stringify(allTargets)), [allTargets]);
            useEffect(() => localStorage.setItem('kbds_inputs', JSON.stringify(inputs)), [inputs]);

            const selected = useMemo(() => allTargets.find(k => k.id === selectedId) || allTargets[0], [selectedId, allTargets]);
            
            const currentTarget = useMemo(() => {
                if (selected?.id === 'gillette_masc' && channelCC) return 25;
                return safeParseFloat(selected?.target || 0);
            }, [selected, channelCC]);

            const actual = useMemo(() => safeParseFloat(inputs.cat) > 0 ? (safeParseFloat(inputs.val) / safeParseFloat(inputs.cat)) * 100 : 0, [inputs]);
            const gap = useMemo(() => Math.max(0, (safeParseFloat(inputs.cat) * (currentTarget / 100)) - safeParseFloat(inputs.val)), [inputs, currentTarget]);
            const status = inputs.cat && inputs.val ? (actual >= currentTarget ? 'OK' : 'ABAIXO') : null;

            const handleAdd = () => {
                const id = `kbd_${Date.now()}`;
                setAllTargets([...allTargets, { id, brand: "Novo KBD", category: "Categoria", target: 30 }]);
                setSelectedId(id);
                setIsEditing(true);
                onNotify("Novo KBD adicionado!");
            };

            const handleDelete = () => {
                if (allTargets.length <= 1) return onNotify("Mínimo 1 KBD necessário.");
                const newT = allTargets.filter(k => k.id !== selectedId);
                setAllTargets(newT);
                setSelectedId(newT[0].id);
                setIsEditing(false);
            };

            const generateKbdsReport = () => {
                const report = `*Relatório KBDS - ${selected.brand}*\n🏢 *Canal:* ${channelCC ? 'C&C' : 'Varejo'}\n📍 *Total ${selected.brand}:* ${inputs.cat} ${unitMode}\n🎯 *Espaço ${selected.category}:* ${inputs.val} ${unitMode}\n📊 *Share:* ${formatSmart(actual)}%\n🎯 *Meta:* ${currentTarget}%\n🚨 *Status:* ${status}\n\n${getTimestamp()}`;
                copyToClipboard(report, onNotify);
            };

            return (
                <div className="space-y-6">
                    <Card>
                        <div className="flex justify-between items-start mb-6">
                            <div><h2 className="text-lg font-bold">Cálculo de KBDS</h2><p className="text-xs text-slate-400">Objetivos Estratégicos</p></div>
                            <div className="flex flex-col items-end">
                                <div className="text-2xl font-black text-emerald-400">{currentTarget}%</div>
                                {selected?.id === 'gillette_masc' && (
                                    <button onClick={() => setChannelCC(!channelCC)} className={`mt-2 px-2 py-1 rounded text-[8px] font-bold uppercase transition-all ${channelCC ? 'bg-orange-600 text-white' : 'bg-black/40 text-slate-500'}`}>C&C {channelCC ? 'ON' : 'OFF'}</button>
                                )}
                            </div>
                        </div>
                        <div className="flex gap-2 mb-4 overflow-x-auto pb-2 scrollbar-hide">
                            {allTargets.map(k => (
                                <button key={k.id} onClick={() => { setSelectedId(k.id); setIsEditing(false); }} className={`px-4 py-2 rounded-xl text-[10px] font-bold uppercase whitespace-nowrap transition-all ${selectedId === k.id ? 'bg-emerald-500 text-white' : 'bg-white/5 text-slate-500'}`}>{k.brand}</button>
                            ))}
                            <button onClick={handleAdd} className="px-3 py-2 bg-white/10 rounded-xl text-emerald-400"><Icon name="plus" className="w-4 h-4"/></button>
                        </div>
                        
                        <div className="space-y-4">
                            {isEditing ? (
                                <div className="grid grid-cols-2 gap-3 p-4 bg-black/20 rounded-2xl border border-white/5 animate-in zoom-in-95">
                                    <div className="col-span-2 flex justify-between items-center mb-1">
                                        <span className="text-[10px] font-bold uppercase text-emerald-400">Editando KBD</span>
                                        <button onClick={handleDelete} className="p-1 text-red-400 hover:bg-red-500/10 rounded-lg"><Icon name="trash" className="w-4 h-4"/></button>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[8px] text-slate-500 uppercase font-bold">Marca</label>
                                        <input value={selected.brand} onChange={(e) => setAllTargets(allTargets.map(k => k.id === selectedId ? {...k, brand: e.target.value} : k))} className="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[8px] text-slate-500 uppercase font-bold">Categoria</label>
                                        <input value={selected.category} onChange={(e) => setAllTargets(allTargets.map(k => k.id === selectedId ? {...k, category: e.target.value} : k))} className="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500" />
                                    </div>
                                    <div className="col-span-2 space-y-1">
                                        <label className="text-[8px] text-slate-500 uppercase font-bold">Meta Objetiva (%)</label>
                                        <input type="number" value={selected.target} onChange={(e) => setAllTargets(allTargets.map(k => k.id === selectedId ? {...k, target: e.target.value} : k))} className="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs outline-none focus:border-emerald-500" />
                                    </div>
                                    <button onClick={() => setIsEditing(false)} className="col-span-2 mt-2 py-2 bg-emerald-500 text-white rounded-xl text-[10px] font-bold uppercase">Salvar Alterações</button>
                                </div>
                            ) : (
                                <>
                                    <SmartInput label={`Total ${selected.brand}`} value={inputs.cat} onChange={(v) => setInputs({ ...inputs, cat: v })} unit={unitMode} />
                                    <SmartInput label={`Espaço ${selected.category}`} value={inputs.val} onChange={(v) => setInputs({ ...inputs, val: v })} unit={unitMode} />
                                    <button onClick={() => setIsEditing(true)} className="w-full py-2 text-[10px] font-bold uppercase text-slate-500 border border-white/5 rounded-xl hover:bg-white/5 flex items-center justify-center gap-2">
                                        <Icon name="settings" className="w-3 h-3"/> Editar Configurações do KBD
                                    </button>
                                </>
                            )}
                        </div>
                    </Card>
                    <ResultCard value={formatSmart(actual)} suffix="%" label="share kbd" highlightColor="text-emerald-400" status={status} gapVal={gap} unitLabel={unitMode} targetVal={currentTarget} description={`Análise de participação da categoria ${selected.category} dentro da marca ${selected.brand}.`} onCopy={generateKbdsReport} canCopy={inputs.cat && inputs.val} />
                </div>
            );
        }

        // --- APP PRINCIPAL ---
        function App() {
            const [activeTab, setActiveTab] = useState('sos');
            const [unitMode, setUnitMode] = useState('cm');
            const [notif, setNotif] = useState("");
            const [sosTargets, setSosTargets] = useState(() => JSON.parse(localStorage.getItem('sos_targets') || '{}'));

            useEffect(() => localStorage.setItem('sos_targets', JSON.stringify(sosTargets)), [sosTargets]);

            const showNotification = (msg) => {
                setNotif(msg);
                setTimeout(() => setNotif(""), 3000);
            };

            return (
                <div className="min-h-screen bg-[#0f172a] flex flex-col max-w-md mx-auto shadow-2xl relative">
                    <header className="px-6 pt-8 pb-4">
                        <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                                    <Icon name="pie" className="w-5 h-5 text-white" />
                                </div>
                                <h1 className="text-xl font-black tracking-tighter uppercase italic">TradePro<span className="text-cyan-400">™</span></h1>
                            </div>
                            <div className="flex items-center gap-1 bg-white/5 px-2 py-1 rounded-full border border-white/10">
                                <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                                <span className="text-[8px] font-bold uppercase text-slate-400">v2.0 Active</span>
                            </div>
                        </div>
                        <p className="text-slate-500 text-[10px] font-medium uppercase tracking-widest">Sistema de Performance SOS/MOP</p>
                    </header>

                    <nav className="px-6 my-4">
                        <div className="flex bg-white/5 border border-white/10 p-1 rounded-2xl">
                            {[{ id: 'cko', label: 'CKO', icon: 'card' }, { id: 'sos', label: 'SOS', icon: 'pie' }, { id: 'kbds', label: 'KBDS', icon: 'bag' }].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-xs font-bold transition-all ${activeTab === tab.id ? 'bg-white/10 text-white' : 'text-slate-500 hover:text-slate-300'}`}>
                                    <Icon name={tab.icon} className="w-4 h-4"/> {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {activeTab !== 'cko' && (
                        <div className="px-6 mb-4 flex justify-center">
                            <div className="bg-white/5 border border-white/10 p-1 rounded-xl flex w-full max-w-xs">
                                {['cm', 'ganchos'].map(u => (
                                    <button key={u} onClick={() => setUnitMode(u)} className={`flex-1 py-2 text-[10px] font-bold uppercase rounded-lg ${unitMode === u ? 'bg-cyan-500 text-white' : 'text-slate-500'}`}>{u}</button>
                                ))}
                            </div>
                        </div>
                    )}

                    <main className="flex-grow px-6 pb-20 max-w-lg mx-auto w-full">
                        {activeTab === 'cko' && <CkoModule onNotify={showNotification} />}
                        {activeTab === 'sos' && <SosModule unitMode={unitMode} onNotify={showNotification} targets={sosTargets} setTargets={setSosTargets} />}
                        {activeTab === 'kbds' && <KbdsModule unitMode={unitMode} onNotify={showNotification} />}
                    </main>

                    {notif && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-500 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 text-xs font-bold animate-bounce border border-emerald-400">
                            <Icon name="check" className="w-4 h-4"/> {notif}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Registro do Service Worker (necessário para o app ser instalável) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
