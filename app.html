const getTimestamp = () => {
  const now = new Date();
  return `📅 *Data:* ${now.toLocaleDateString('pt-BR')} às ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
};
const formatSmart = (val, decimals = 1) => {
  if (!val) return "0";
  return Number(val.toFixed(decimals)).toString();
};
const copyToClipboard = (text, onSuccess) => {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); onSuccess('Copiado com sucesso!'); }
  catch (err) { console.error(err); }
  document.body.removeChild(ta);
};
const downloadHtmlReport = (data, mainTitle) => {
  const reports = Array.isArray(data) ? data : [{ title: mainTitle, text: data }];
  const sectionsHtml = reports.map(r => {
    const html = r.text
      .replace(/\*(.*?)\*/g, '<strong style="color:#22d3ee;">$1</strong>')
      .replace(/_(.*?)_/g, '<em style="color:#94a3b8;">$1</em>')
      .replace(/\n/g, '<br/>');
    return `<div class="section">${reports.length > 1 ? `<h2>${r.title}</h2>` : ''}<p>${html}</p></div>`;
  }).join('<hr/>');

  const fullHtml = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
  <title>${mainTitle}</title><style>
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#080b12;color:#f1f5f9;margin:0;padding:2rem;display:flex;justify-content:center;}
  .card{background:#0f1420;border:1px solid #22303f;border-radius:1.25rem;padding:2.5rem;max-width:520px;width:100%;}
  h1{font-size:1.4rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #22303f;padding-bottom:1rem;margin:0 0 1.5rem;}
  h2{font-size:1rem;color:#8b8cf8;text-transform:uppercase;margin:1rem 0 .5rem;}
  hr{border:0;height:1px;background:#22303f;margin:2rem 0;}
  p{line-height:1.7;font-size:.95rem;color:#cbd5e1;margin:0;}
  .footer{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid #22303f;font-size:.7rem;color:#64748b;text-align:center;text-transform:uppercase;letter-spacing:.1em;}
  </style></head><body><div class="card"><h1>📊 ${mainTitle}</h1>${sectionsHtml}
  <div class="footer">TradePro Performance • ${reports.length} registro(s)</div></div></body></html>`;

  const blob = new Blob([fullHtml], { type:'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Relatorio_${mainTitle.replace(/[^a-zA-Z0-9]/g,'_')}_${Date.now()}.html`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const MeasureGauge = ({ percentage = 0, target = null, color = '#22d3ee', unit = '%' }) => {
  const pct = Math.min(Math.max(percentage, 0), 100);
  const ticks = Array.from({ length: 50 });
  return (
    <div className="w-full select-none">
      <div className="relative h-11 rounded-lg overflow-hidden border border-white/10 bg-black/40">
        <div className="absolute inset-0 flex">
          {ticks.map((_, i) => (
            <div key={i} className={`flex-1 border-r ${ (i+1) % 5 === 0 ? 'border-white/15' : 'border-white/[.04]'}`} />
          ))}
        </div>
        <div
          className="absolute top-0 left-0 h-full transition-all duration-700 ease-out"
          style={{ width: `${pct}%`, background: `linear-gradient(90deg, ${color}33, ${color}cc)` }}
        />
        <div className="absolute top-0 left-0 h-full transition-all duration-700 ease-out border-r-2" style={{ width:`${pct}%`, borderColor: color }} />
        {target != null && target > 0 && (
          <div className="absolute top-0 h-full w-[2px] bg-amber-400/90 z-10" style={{ left: `${Math.min(target, 100)}%` }}>
            <span className="absolute -top-4 left-1/2 -translate-x-1/2 text-[8px] font-mono font-bold text-amber-400 whitespace-nowrap">{formatSmart(target)}</span>
          </div>
        )}
        <div className="absolute inset-0 flex items-center justify-end pr-3">
          <span className="font-mono text-sm font-bold text-white drop-shadow-[0_1px_3px_rgba(0,0,0,.8)] tabular-nums">{formatSmart(percentage)}{unit}</span>
        </div>
      </div>
      <div className="flex justify-between mt-1 px-0.5 font-mono text-[8px] text-slate-600">
        <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
      </div>
    </div>
  );
};

/* ============ MÓDULO: CKO ============ */
function CkoModule({ onNotify, onStat }) {
  const [inputs, setInputs] = useState({ presenca: '', total: '' });
  const [selectedBrands, setSelectedBrands] = useState([]);
  const [showBrands, setShowBrands] = useState(false);
  const [history, setHistory] = useState([]);

  const result = useMemo(() => {
    const p = parseFloat(inputs.presenca) || 0, t = parseFloat(inputs.total) || 0;
    return t > 0 ? (p / t) * 100 : 0;
  }, [inputs]);

  useEffect(() => { onStat(inputs.presenca && inputs.total ? result : null); }, [result, inputs]);

  const getReportText = () => {
    if (!inputs.presenca || !inputs.total) return null;
    const brandsText = selectedBrands.length ? selectedBrands.join(', ') : "Geral";
    return `*Relatório CKO*\n\n🛍 *Marcas:* ${brandsText}\n💳 *CKO com Presença:* ${inputs.presenca} un\n🏪 *Total CKO Loja:* ${inputs.total} un\n📊 *Penetração:* ${formatSmart(result)}%\n\n${getTimestamp()}\n\n⚠ _CKO CNPJ não incluso no cálculo_`;
  };
  const handleSaveToList = () => {
    const text = getReportText(); if (!text) return;
    const brandsText = selectedBrands.length ? selectedBrands.join(', ') : "Geral";
    setHistory([...history, { id: Date.now(), title: `CKO - ${brandsText} (${formatSmart(result)}%)`, text }]);
    onNotify("Adicionado à lista de relatórios!");
    setInputs({ presenca: '', total: '' });
  };
  const handleCopyAll = () => copyToClipboard(history.map(h => h.text).join('\n\n-------------------------\n\n'), onNotify);
  const handleDownloadAll = () => { downloadHtmlReport(history, 'Relatório Completo CKO'); onNotify("HTML consolidado baixado!"); };

  return (
    <div>
      <Panel accent="var(--rose,#fb7185)">
        <div className="mb-4">
          <h2 className="font-display text-base font-semibold">Penetração CKO</h2>
          <p className="text-slate-500 text-xs">Presença da marca nos checkouts da loja</p>
        </div>
        <div className="mb-4 border border-white/10 rounded-xl overflow-hidden bg-black/20">
          <button onClick={() => setShowBrands(!showBrands)} className="w-full flex items-center justify-between p-3.5 bg-white/5 hover:bg-white/10 transition-colors">
            <span className="flex items-center gap-2 text-sm font-semibold"><Tag className="w-4 h-4 text-cyan-400" /> Marcas presentes {selectedBrands.length > 0 && <span className="bg-rose-500 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center font-mono">{selectedBrands.length}</span>}</span>
            <Chevron className={`w-4 h-4 text-slate-400 transition-transform duration-300 ${showBrands ? 'rotate-180' : ''}`} />
          </button>
          {showBrands && (
            <div className="p-3.5 border-t border-white/10 max-h-[220px] overflow-y-auto no-scrollbar">
              {CKO_BRANDS.map(brand => (
                <button key={brand} onClick={() => setSelectedBrands(s => s.includes(brand) ? s.filter(b => b !== brand) : [...s, brand])}
                  className={`w-full flex items-center justify-between p-2.5 mb-1.5 rounded-lg border text-xs transition-all ${selectedBrands.includes(brand) ? 'bg-cyan-500/15 border-cyan-500/40' : 'bg-black/20 border-white/5 text-slate-400'}`}>
                  {brand} {selectedBrands.includes(brand) ? <Check className="w-4 h-4 text-cyan-400" /> : <div className="w-4 h-4 border border-white/10 rounded" />}
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="space-y-3">
          <SmartInput label="CKO com presença" value={inputs.presenca} onChange={v => setInputs({ ...inputs, presenca: v })} unit="un" />
          <SmartInput label="Total de CKO na loja" value={inputs.total} onChange={v => setInputs({ ...inputs, total: v })} unit="un" />
        </div>
      </Panel>

      <ResultPanel
        gaugeValue={result} gaugeColor="#fb7185" gaugeUnit="%" title="Execução CKO"
        reportTitle="Relatório de Penetração CKO"
        description="Percentual de checkouts da loja com presença dos itens analisados."
        getReportText={getReportText} canCopy={inputs.presenca && inputs.total}
        onNotify={onNotify} onSaveToList={handleSaveToList}
      />

      <SavedList reports={history} moduleName="CKO" onRemove={i => setHistory(history.filter((_, idx) => idx !== i))} onClear={() => setHistory([])} onCopyAll={handleCopyAll} onDownloadAll={handleDownloadAll} />
    </div>
  );
}

/* ============ MÓDULO: SOS ============ */
function SosModule({ unitMode, onNotify, onStat, targets, setTargets }) {
  const [inputs, setInputs] = useState({ marca: '', total: '' });
  const [brand, setBrand] = useState(GENERAL_BRANDS[0]);
  const [history, setHistory] = useState([]);
  const [showTargets, setShowTargets] = useState(false);
  const unitLabel = unitMode === 'cm' ? 'cm' : 'ganchos';

  const result = useMemo(() => {
    const m = parseFloat(inputs.marca) || 0, t = parseFloat(inputs.total) || 0;
    return t > 0 ? (m / t) * 100 : 0;
  }, [inputs]);

  const targetShare = useMemo(() => {
    const v = targets[brand];
    return (v !== undefined && v !== '' && v !== null) ? parseFloat(v) || 0 : null;
  }, [brand, targets]);

  const gapVal = useMemo(() => {
    if (targetShare == null) return 0;
    const t = parseFloat(inputs.total) || 0, m = parseFloat(inputs.marca) || 0;
    return Math.max(0, (t * (targetShare / 100)) - m);
  }, [targetShare, inputs]);

  const status = useMemo(() => {
    if (targetShare == null || !inputs.marca || !inputs.total) return null;
    return result >= targetShare ? 'OK' : 'ABAIXO';
  }, [result, targetShare, inputs]);

  useEffect(() => { onStat(inputs.marca && inputs.total ? result : null); }, [result, inputs]);

  const handleTargetChange = (b, val) => setTargets({ ...targets, [b]: val });
  const clearTargets = () => { setTargets({}); onNotify("Metas removidas!"); };
  const definedTargets = Object.entries(targets).filter(([, v]) => v !== '' && v !== undefined && v !== null);

  const getReportText = () => {
    if (!inputs.marca || !inputs.total) return null;
    let report = `*Relatório SOS - ${brand}*\n\n📏 *Modo:* ${unitMode.toUpperCase()}\n📍 *Espaço ${brand}:* ${inputs.marca} ${unitLabel}\n🌍 *Total Categoria:* ${inputs.total} ${unitLabel}\n📊 *Share Atual:* ${formatSmart(result)}%`;
    if (targetShare != null) {
      report += `\n🎯 *Objetivo:* ${formatSmart(targetShare)}%\n🚨 *Status:* ${status}`;
      report += status === 'OK' ? `\n✅ *Meta Batida!*` : `\n🛠️ *Faltam:* ${formatSmart(gapVal)} ${unitLabel}`;
    }
    report += `\n\n${getTimestamp()}`;
    return report;
  };
  const handleSaveToList = () => {
    const text = getReportText(); if (!text) return;
    setHistory([...history, { id: Date.now(), title: `SOS - ${brand} (${formatSmart(result)}%)`, text }]);
    onNotify("Adicionado à lista de relatórios!");
    setInputs({ marca: '', total: '' });
  };
  const handleCopyAll = () => copyToClipboard(history.map(h => h.text).join('\n\n-------------------------\n\n'), onNotify);
  const handleDownloadAll = () => { downloadHtmlReport(history, 'Relatório Completo SOS'); onNotify("HTML consolidado baixado!"); };

  return (
    <div>
      <Panel accent="var(--cyan)">
        <div className="flex items-start justify-between mb-4">
          <div>
            <h2 className="font-display text-base font-semibold">Participação (SOS)</h2>
            <p className="text-slate-500 text-xs">Share de espaço na categoria</p>
          </div>
          <button onClick={() => setShowTargets(!showTargets)} className={`p-2.5 rounded-xl border transition-all shrink-0 ${showTargets ? 'bg-cyan-500 border-cyan-400' : 'bg-white/5 border-white/10 text-slate-400'}`} title="Configurar metas por marca">
            <Settings className="w-4 h-4" />
          </button>
        </div>

        {showTargets && (
          <div className="mb-5 p-4 bg-cyan-500/5 border border-cyan-500/20 rounded-2xl animate-rise">
            <div className="flex items-center justify-between mb-3">
              <span className="text-[10px] font-bold uppercase text-cyan-400 tracking-widest">Metas por marca (%)</span>
              <button onClick={clearTargets} className="text-[10px] text-slate-500 hover:text-rose-400 underline decoration-slate-700">Limpar tudo</button>
            </div>
            <div className="grid grid-cols-2 gap-2.5">
              {GENERAL_BRANDS.map(b => (

                  <input type="number" inputMode="decimal" placeholder="Meta %" value={targets[b] ?? ''} onChange={e => handleTargetChange(b, e.target.value)}

                </div>
              ))}
            </div>
            <button onClick={() => setShowTargets(false)} className="w-full mt-4 py-2 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 text-[10px] font-bold uppercase rounded-lg border border-cyan-500/30">Concluir</button>
          </div>
        )}

        {definedTargets.length > 0 && !showTargets && (
          <div className="mb-4 flex flex-wrap gap-1.5">
            {definedTargets.map(([k, v]) => (
              <button key={k} onClick={() => setBrand(k)} className={`px-2 py-1 rounded-md text-[9px] font-bold border transition-all ${brand === k ? 'bg-cyan-500/20 border-cyan-500/50 text-white' : 'bg-black/30 border-white/5 text-slate-400'}`}>
                {k}: <span className="text-cyan-400">{formatSmart(parseFloat(v) || 0)}%</span>
              </button>
            ))}
          </div>
        )}

        <BrandSelect selected={brand} onChange={setBrand} options={GENERAL_BRANDS} />
        <div className="space-y-3">
          <SmartInput label={`Espaço ${brand}`} value={inputs.marca} onChange={v => setInputs({ ...inputs, marca: v })} unit={unitLabel} />
          <SmartInput label="Espaço total mundo" value={inputs.total} onChange={v => setInputs({ ...inputs, total: v })} unit={unitLabel} />
        </div>
      </Panel>

      <ResultPanel
        gaugeValue={result} gaugeTarget={targetShare} gaugeColor={status === 'ABAIXO' ? '#fb7185' : '#22d3ee'} gaugeUnit="%" title="Sua participação" status={status}
        reportTitle={`Relatório SOS - ${brand}`}
        description={targetShare != null
          ? (gapVal > 0 ? `Abaixo da meta de ${formatSmart(targetShare)}%. Faltam ${formatSmart(gapVal)} ${unitLabel} de ${brand}.` : `Meta de ${formatSmart(targetShare)}% atingida ou superada.`)
          : `Percentual do espaço total da categoria ocupado por ${brand}. Defina uma meta no ícone de ajuste acima.`}
        getReportText={getReportText} canCopy={inputs.marca && inputs.total}
        onNotify={onNotify} onSaveToList={handleSaveToList}
      />

      <SavedList reports={history} moduleName="SOS" onRemove={i => setHistory(history.filter((_, idx) => idx !== i))} onClear={() => setHistory([])} onCopyAll={handleCopyAll} onDownloadAll={handleDownloadAll} />
    </div>
  );
}

/* ============ MÓDULO: MOP ============ */
function MopModule({ unitMode, onNotify, onStat }) {
  const [inputs, setInputs] = useState({ total: '', meta: '' });
  const [brand, setBrand] = useState(GENERAL_BRANDS[0]);
  const [history, setHistory] = useState([]);
  const unitLabel = unitMode === 'cm' ? 'cm' : 'ganchos';

  const rawResult = useMemo(() => {
    const t = parseFloat(inputs.total) || 0, m = parseFloat(inputs.meta) || 0;
    return t * (m / 100);
  }, [inputs]);
  const metaPct = parseFloat(inputs.meta) || 0;

  useEffect(() => { onStat(inputs.total && inputs.meta ? metaPct : null); }, [metaPct, inputs]);

  const getReportText = () => {
    if (!inputs.total || !inputs.meta) return null;
    return `*Planejamento MOP - ${brand}*\n\n📏 *Modo:* ${unitMode.toUpperCase()}\n🌍 *Total Categoria:* ${inputs.total} ${unitLabel}\n🎯 *Objetivo:* ${inputs.meta}%\n🛠️ *Necessário para ${brand}:* ${formatSmart(rawResult)} ${unitLabel}\n\n${getTimestamp()}`;
  };
  const handleSaveToList = () => {
    const text = getReportText(); if (!text) return;
    setHistory([...history, { id: Date.now(), title: `MOP - ${brand} (Necessário: ${formatSmart(rawResult)} ${unitLabel})`, text }]);
    onNotify("Adicionado à lista de relatórios!");
    setInputs({ total: '', meta: '' });
  };
  const handleCopyAll = () => copyToClipboard(history.map(h => h.text).join('\n\n-------------------------\n\n'), onNotify);
  const handleDownloadAll = () => { downloadHtmlReport(history, 'Relatório Completo MOP'); onNotify("HTML consolidado baixado!"); };

  return (
    <div>
      <Panel accent="var(--indigo)">
        <div className="mb-4">
          <h2 className="font-display text-base font-semibold">MOP</h2>
          <p className="text-slate-500 text-xs">Planejamento de objetivo em {unitMode === 'cm' ? 'centímetros' : 'ganchos'}</p>
        </div>
        <BrandSelect selected={brand} onChange={setBrand} options={GENERAL_BRANDS} />
        <div className="space-y-3">
          <SmartInput label="Espaço total mundo" value={inputs.total} onChange={v => setInputs({ ...inputs, total: v })} unit={unitLabel} />
          <SmartInput label={`% objetivo ${brand}`} value={inputs.meta} onChange={v => setInputs({ ...inputs, meta: v })} unit="%" />
        </div>
      </Panel>

      <ResultPanel
        gaugeValue={metaPct} gaugeColor="#8b8cf8" gaugeUnit="%" title="Quantidade necessária"
        reportTitle={`Planejamento MOP - ${brand}`}
        description={`${formatSmart(rawResult)} ${unitLabel} necessários para ${brand} atingir o objetivo de share.`}
        getReportText={getReportText} canCopy={inputs.total && inputs.meta}
        onNotify={onNotify} onSaveToList={handleSaveToList}
      />

      <SavedList reports={history} moduleName="MOP" onRemove={i => setHistory(history.filter((_, idx) => idx !== i))} onClear={() => setHistory([])} onCopyAll={handleCopyAll} onDownloadAll={handleDownloadAll} />
    </div>
  );
}

/* ============ MÓDULO: KBDS ============ */
function KbdsModule({ unitMode, onNotify, setUnitMode, onStat }) {
  const [allTargets, setAllTargets] = useState(KBDS_TARGETS);
  const [selectedKbdId, setSelectedKbdId] = useState(allTargets[0].id);
  const [inputs, setInputs] = useState({ cat: '', brandVal: '', manualTarget: '' });
  const [channelCC, setChannelCC] = useState(false);
  const [isEditing, setIsEditing] = useState(false);
  const [history, setHistory] = useState([]);

  const selectedKbd = useMemo(() => allTargets.find(k => k.id === selectedKbdId) || allTargets[0], [selectedKbdId, allTargets]);

  const handleKbdChange = (e) => {
    const kbdId = e.target.value;
    setSelectedKbdId(kbdId);
    const kbd = allTargets.find(k => k.id === kbdId);
    if (kbd && kbd.unit !== 'manual' && kbd.unit !== unitMode) setUnitMode(kbd.unit);
    setChannelCC(false);
  };
  const updateCurrentTarget = (field, value) => setAllTargets(prev => prev.map(t => t.id === selectedKbdId ? { ...t, [field]: value } : t));
  const addNewKbd = () => {
    const newId = `kbd_${Date.now()}`;
    setAllTargets([...allTargets, { id: newId, brand: "Nova Marca", category: "Nova Categoria", target: 0, unit: unitMode === 'manual' ? 'cm' : unitMode }]);
    setSelectedKbdId(newId); setIsEditing(true);
    onNotify("Novo KBD adicionado!");
  };
  const removeKbd = () => {
    if (allTargets.length <= 1) { onNotify("Não é possível remover a última meta."); return; }
    const idx = allTargets.findIndex(t => t.id === selectedKbdId);
    const newTargets = allTargets.filter(t => t.id !== selectedKbdId);
    setAllTargets(newTargets);
    setSelectedKbdId(newTargets[Math.max(0, idx - 1)].id);
    setIsEditing(false);
    onNotify("Meta removida com sucesso!");
  };

  const targetVal = useMemo(() => {
    if (selectedKbd.id === 'custom') return parseFloat(inputs.manualTarget) || 0;
    if (selectedKbd.id === 'gillette_masc' && channelCC) return 25;
    return parseFloat(selectedKbd.target) || 0;
  }, [selectedKbd, channelCC, inputs.manualTarget]);

  const actualShare = useMemo(() => {
    const c = parseFloat(inputs.cat) || 0, b = parseFloat(inputs.brandVal) || 0;
    return c > 0 ? (b / c) * 100 : 0;
  }, [inputs]);

  const gapVal = useMemo(() => {
    const c = parseFloat(inputs.cat) || 0;
    const necessary = c * (targetVal / 100);
    const actual = parseFloat(inputs.brandVal) || 0;
    return Math.max(0, necessary - actual);
  }, [inputs, targetVal]);

  const status = useMemo(() => (!inputs.cat || !inputs.brandVal) ? null : (actualShare >= targetVal ? 'OK' : 'ABAIXO'), [actualShare, targetVal, inputs]);
  const unitLabel = unitMode === 'cm' ? 'cm' : 'ganchos';

  useEffect(() => { onStat(inputs.cat && inputs.brandVal ? actualShare : null); }, [actualShare, inputs]);

  const getReportText = () => {
    if (!inputs.cat || !inputs.brandVal) return null;
    const channelText = channelCC ? 'C&C' : 'Varejo';
    return `*Relatório KBDS 2026 - ${selectedKbd.brand}*\n\n🏢 *Canal:* ${channelText}\n📋 *Categoria:* ${selectedKbd.category}\n📏 *Modo:* ${unitMode.toUpperCase()}\n🌍 *Total ${selectedKbd.brand}:* ${inputs.cat} ${unitLabel}\n📍 *Espaço ${selectedKbd.category}:* ${inputs.brandVal} ${unitLabel}\n🎯 *Objetivo:* ${formatSmart(targetVal)}%\n📊 *Share Atual:* ${formatSmart(actualShare)}%\n🚨 *Status:* ${status}\n${gapVal > 0 ? `🛠️ *Faltam:* ${formatSmart(gapVal)} ${unitLabel}` : '✅ *Meta Batida!*'}\n\n${getTimestamp()}`;
  };
  const handleSaveToList = () => {
    const text = getReportText(); if (!text) return;
    setHistory([...history, { id: Date.now(), title: `KBDS - ${selectedKbd.brand} - ${selectedKbd.category} (${formatSmart(actualShare)}%)`, text }]);
    onNotify("Adicionado à lista de relatórios!");
    setInputs({ cat: '', brandVal: '', manualTarget: '' });
  };
  const handleCopyAll = () => copyToClipboard(history.map(h => h.text).join('\n\n-------------------------\n\n'), onNotify);
  const handleDownloadAll = () => { downloadHtmlReport(history, 'Relatório Completo KBDS'); onNotify("HTML consolidado baixado!"); };

  return (
    <div>
      <Panel accent="var(--emerald)">
        <div className="flex justify-between items-start mb-4">
          <div>
            <h2 className="font-display text-base font-semibold">Cálculo de KBDS</h2>
            <p className="text-slate-500 text-[11px]">Compare sua execução com a meta oficial 2026</p>
          </div>
          <div className="flex flex-col items-end">
            <span className="text-[9px] text-slate-500 font-bold uppercase mb-1">Objetivo</span>
            <div className="font-mono text-xl font-black text-emerald-400 tabular-nums animate-pop" key={targetVal}>{formatSmart(targetVal)}%</div>
            {selectedKbd.id === 'gillette_masc' && (
              <button onClick={() => setChannelCC(!channelCC)} className={`mt-2 px-2 py-1 rounded-md text-[8px] font-black uppercase flex items-center gap-1 border transition-all ${channelCC ? 'bg-orange-600/90 border-orange-500' : 'bg-black/40 text-slate-500 border-white/5'}`}>
                <Store className="w-2.5 h-2.5" /> C&C {channelCC ? 'ATIVO' : ''}
              </button>
            )}
          </div>
        </div>

        <div className="mb-4 flex gap-2">
          <div className="flex-grow relative">
            <label className="text-[9px] text-slate-500 font-bold uppercase block mb-1">Selecione o KBD</label>
            <select value={selectedKbdId} onChange={handleKbdChange} className="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-xs font-medium outline-none focus:border-cyan-500">
              {allTargets.map(k => <option key={k.id} value={k.id}>{k.brand} - {k.category}</option>)}
            </select>
          </div>
          <div className="flex items-end">
            <button onClick={() => setIsEditing(!isEditing)} className={`p-3 rounded-xl border transition-all ${isEditing ? 'bg-cyan-500 border-cyan-400' : 'bg-white/5 border-white/10 text-slate-400'}`} title="Configurar metas">
              <Settings className="w-5 h-5" />
            </button>
          </div>
        </div>

        {isEditing && (
          <div className="mb-5 p-4 bg-cyan-500/5 border border-cyan-500/20 rounded-2xl space-y-3 animate-rise">
            <div className="flex items-center justify-between mb-1">
              <span className="text-[10px] font-bold uppercase text-cyan-400 tracking-widest">Painel de ajuste</span>
              <div className="flex gap-2">
                <button onClick={removeKbd} className="p-1.5 bg-rose-500/10 hover:bg-rose-500/20 rounded-lg text-rose-400 border border-rose-500/20"><Trash className="w-3.5 h-3.5" /></button>
                <button onClick={addNewKbd} className="flex items-center gap-1 px-2 py-1 bg-white/10 hover:bg-white/20 rounded-lg text-[9px] font-bold uppercase border border-white/10"><Plus className="w-3 h-3 text-emerald-400" /> Novo</button>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[9px] text-slate-500 font-bold uppercase ml-1">Marca</label>
                <input type="text" value={selectedKbd.brand} onChange={e => updateCurrentTarget('brand', e.target.value)} className="w-full bg-black/40 border border-white/5 rounded-lg px-3 py-2 text-xs outline-none focus:border-cyan-500/50" />
              </div>
              <div>
                <label className="text-[9px] text-slate-500 font-bold uppercase ml-1">Categoria</label>
                <input type="text" value={selectedKbd.category} onChange={e => updateCurrentTarget('category', e.target.value)} className="w-full bg-black/40 border border-white/5 rounded-lg px-3 py-2 text-xs outline-none focus:border-cyan-500/50" />
              </div>
            </div>
            <div>
              <label className="text-[9px] text-slate-500 font-bold uppercase ml-1">Meta (%)</label>
              <input type="number" value={selectedKbd.target} onChange={e => updateCurrentTarget('target', e.target.value)} className="w-full bg-black/40 border border-white/5 rounded-lg px-3 py-2 text-xs outline-none focus:border-cyan-500/50" />
            </div>
            <button onClick={() => { setIsEditing(false); onNotify("Configurações salvas!"); }} className="w-full py-2 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 text-[10px] font-bold uppercase rounded-lg border border-cyan-500/30">Concluir</button>
          </div>
        )}

        {selectedKbd.id === 'custom' && (
          <div className="mb-4"><SmartInput label="Meta personalizada (%)" value={inputs.manualTarget} onChange={v => setInputs({ ...inputs, manualTarget: v })} unit="%" /></div>
        )}

        <div className="space-y-3">
          <SmartInput label={`Total ${selectedKbd.brand}`} value={inputs.cat} onChange={v => setInputs({ ...inputs, cat: v })} unit={unitLabel} />
          <SmartInput label={`Espaço ${selectedKbd.category}`} value={inputs.brandVal} onChange={v => setInputs({ ...inputs, brandVal: v })} unit={unitLabel} />
        </div>

        {inputs.cat && inputs.brandVal && (
          <div className={`mt-4 p-3.5 rounded-xl border flex items-start gap-2 text-[10px] leading-tight animate-pop ${status === 'OK' ? 'bg-emerald-500/10 border-emerald-500/25 text-emerald-300' : 'bg-rose-500/10 border-rose-500/25 text-rose-300'}`}>
            <Alert className="w-3 h-3 shrink-0 mt-0.5" />
            <p>Não arredondamos o resultado. Verifique a execução antes de prosseguir.</p>
          </div>
        )}
      </Panel>

      <ResultPanel
        gaugeValue={actualShare} gaugeTarget={targetVal} gaugeColor={status === 'ABAIXO' ? '#fb7185' : '#34d399'} gaugeUnit="%"
        title="Execução KBDS" status={status} reportTitle={`Relatório KBDS 2026 - ${selectedKbd.brand}`}
        description={gapVal > 0 ? `Abaixo do objetivo de ${formatSmart(targetVal)}%. Adicione mais ${formatSmart(gapVal)} ${unitLabel} da marca.` : `Excelente! Você atingiu ou superou o objetivo oficial de ${formatSmart(targetVal)}%.`}
        getReportText={getReportText} canCopy={inputs.cat && inputs.brandVal}
        onNotify={onNotify} onSaveToList={handleSaveToList}
      />

      <SavedList reports={history} moduleName="KBDS" onRemove={i => setHistory(history.filter((_, idx) => idx !== i))} onClear={() => setHistory([])} onCopyAll={handleCopyAll} onDownloadAll={handleDownloadAll} />
    </div>
  );
}

/* ============ APP PRINCIPAL ============ */
function App() {
  const [activeTab, setActiveTab] = useState('cko');
  const [unitMode, setUnitMode] = useState('cm');
  const [notification, setNotification] = useState(null);
  const [now, setNow] = useState(new Date());
  const [stats, setStats] = useState({ cko: null, sos: null, mop: null, kbds: null });
  const [brandTargets, setBrandTargets] = useState({});
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showIosHint, setShowIosHint] = useState(false);
  const [installDismissed, setInstallDismissed] = useState(false);

  useEffect(() => { const id = setInterval(() => setNow(new Date()), 1000 * 30); return () => clearInterval(id); }, []);
  const showNotification = (msg) => { setNotification(msg); setTimeout(() => setNotification(null), 3000); };

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isIOS && !isStandalone) setShowIosHint(true);
    return () => window.removeEventListener('beforeinstallprompt', handler);

  const handleInstallClick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);

  const setStat = (key) => (val) => setStats(s => (s[key] === val ? s : { ...s, [key]: val }));

  const tabs = [
    { id: 'cko', label: 'CKO', icon: CreditCard, color: '#fb7185' },
    { id: 'sos', label: 'SOS', icon: Gauge, color: '#22d3ee' },

            </div>

          </div>
          <p className="text-slate-500 text-[10px] font-semibold uppercase tracking-[0.15em]">Painel de Desempenho Avançado</p>
        </div>
        <div className="text-right animate-rise">
          <div className="flex items-center justify-end gap-1 text-slate-500"><Clock className="w-3 h-3" /><span className="font-mono text-[10px]">{now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span></div>
          <span className="font-mono text-[10px] text-slate-600">{now.toLocaleDateString('pt-BR')}</span>
        </div>
      </header>

      {!installDismissed && (deferredPrompt || showIosHint) && (

              <Ruler className="w-4 h-4 text-cyan-400" />
            </div>
            <div className="flex-grow min-w-0">
              <p className="text-xs font-semibold text-white">Instale o TradePro no seu celular</p>

        <div className="relative z-10 px-5 mb-4 flex justify-center animate-rise">
          <div className="bg-white/[.03] p-1 rounded-xl border border-white/10 flex gap-1 w-full max-w-xs">
            <button onClick={() => setUnitMode('cm')} className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-[11px] font-bold uppercase tracking-wide transition-all ${unitMode === 'cm' ? 'bg-cyan-500 shadow-lg shadow-cyan-500/25' : 'text-slate-500 hover:bg-white/5'}`}>
              <Ruler className="w-3 h-3" /> Centímetros
            </button>
            <button onClick={() => setUnitMode('ganchos')} className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-[11px] font-bold uppercase tracking-wide transition-all ${unitMode === 'ganchos' ? 'bg-indigo-500 shadow-lg shadow-indigo-500/25' : 'text-slate-500 hover:bg-white/5'}`}>
              <div className="rotate-90"><Share2 className="w-3 h-3" /></div> Ganchos
            </button>
          </div>
        </div>
      )}

      <div className="relative z-10 px-5 mb-5">
        <nav className="flex p-1 bg-white/[.03] border border-white/10 rounded-2xl">
          {tabs.map(t => <NavButton key={t.id} id={t.id} active={activeTab} onClick={setActiveTab} label={t.label} icon={t.icon} />)}
        </nav>
      </div>

      <main className="relative z-10 px-5 pb-24 flex-grow">
        <div className={activeTab === 'cko' ? 'block animate-rise' : 'hidden'}><CkoModule onNotify={showNotification} onStat={setStat('cko')} /></div>
        <div className={activeTab === 'sos' ? 'block animate-rise' : 'hidden'}><SosModule unitMode={unitMode} onNotify={showNotification} onStat={setStat('sos')} targets={brandTargets} setTargets={setBrandTargets} /></div>
        <div className={activeTab === 'mop' ? 'block animate-rise' : 'hidden'}><MopModule unitMode={unitMode} onNotify={showNotification} onStat={setStat('mop')} /></div>
        <div className={activeTab === 'kbds' ? 'block animate-rise' : 'hidden'}><KbdsModule unitMode={unitMode} onNotify={showNotification} setUnitMode={setUnitMode} onStat={setStat('kbds')} /></div>
      </main>

      <footer className="relative z-10 text-center pb-6 -mt-16">
        <p className="font-mono text-[9px] text-slate-700 uppercase tracking-widest">TradePro Performance • Painel Avançado</p>
      </footer>

      {notification && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] w-max animate-pop">
          <div className="bg-emerald-500/95 backdrop-blur-md px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-sm font-medium border border-emerald-400/50">
            <Check className="w-4 h-4" />{notification}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('SW falhou:', err));
    });
  }
</script>
</body>
</html>
